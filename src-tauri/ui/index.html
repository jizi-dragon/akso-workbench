<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workbench · 启动中</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #eef4fc; color: #16324f;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .card { width: min(440px, calc(100vw - 48px)); text-align: center; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
      background: linear-gradient(135deg, #1e6fff, #0fa3b1);
      box-shadow: 0 10px 24px rgba(30, 111, 255, .24);
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .01em; }
    p { margin: 0; color: #5b7185; font-size: 13px; line-height: 1.7; }
    .bar {
      height: 3px; margin: 24px auto 0; width: 160px; border-radius: 999px;
      background: #d7e6f6; overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; width: 48px; height: 100%; border-radius: inherit;
      background: #1e6fff; animation: slide 1.1s ease-in-out infinite;
    }
    #msg { margin-top: 18px; }
    @keyframes slide { 0% { transform: translateX(-52px); } 100% { transform: translateX(164px); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true"></div>
    <h1>Workbench</h1>
    <p>正在启动本地服务…</p>
    <div class="bar" aria-hidden="true"></div>
    <p id="msg"></p>
  </main>
  <script>
    // Tauri 侧健康检查失败时会用 eval 往这里写原因；页面本身不访问网络。
    const params = new URLSearchParams(location.search);
    if (params.has("error")) {
      document.getElementById("msg").textContent = params.get("error");
    }
  </script>
</body>
</html>
