[package]
name = "workbench-desktop"
version = "0.4.2"
description = "Workbench desktop shell (Tauri 2 + Python sidecar)"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "Workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
