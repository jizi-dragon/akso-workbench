<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Akso</title>
    <style>
      body { font-family: "HarmonyOS Sans SC", "Microsoft YaHei UI", sans-serif;
             background: #eef4fc; color: #17233b;
             display: flex; align-items: center; justify-content: center;
             height: 100vh; margin: 0; font-size: 14px; }
      #wrap { max-width: 720px; padding: 0 24px; line-height: 1.7; }
      #msg { font-size: 15px; font-weight: 600; }
      #hint { margin-top: 10px; color: #4a5a75; }
      #detail { margin-top: 14px; color: #6b7a93; font-size: 12px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="msg">…</div>
      <div id="hint"></div>
      <div id="detail"></div>
    </div>
    <script>
      // 壳把"就绪探测探到了什么"经 detail 传进来（ADR-0011 §D-6）：
      // 光显示"超时"无法区分「服务还没起来」与「端口上坐着别人的服务」——
      // 后者正是那次"代码改了但 UI 没变"事故的形态，必须让它在现场看得见。
      const params = new URLSearchParams(location.search);
      const msg = document.getElementById('msg');
      const hint = document.getElementById('hint');
      const detailEl = document.getElementById('detail');
      if (params.get('error') === 'timeout') {
        const raw = decodeURIComponent(params.get('detail') || '');
        const [reason, seenRaw] = raw.split('|');
        msg.textContent = '服务未就绪——主界面无法加载。';
        if (reason === 'wrong-app' || (reason || '').startsWith('wrong-app')) {
          hint.textContent =
            '这个端口上有其它程序在应答（不是一个可用的 Workbench 服务）。' +
            '常见原因：另一个版本的工作台还开着，或该端口被别的软件占用。' +
            '请先退出那个实例 / 释放端口，再重启本程序。';
        } else if (reason === 'no-response' || reason === 'timeout') {
          hint.textContent =
            '服务端没有应答。请看 %APPDATA%\\Workbench\\logs\\ 下的 ' +
            'workbench-<日期>.jsonl（运行日志）与 tauri-sidecar.log（进程原始输出），' +
            '以及 %APPDATA%\\Workbench\\server.log（启动面包屑），然后重启 Workbench。';
        } else {
          hint.textContent = '服务启动异常，请重启 Workbench 并查看上面的日志文件。';
        }
        detailEl.textContent = raw ? `探测详情：${raw}` : '';
      } else {
        msg.textContent = '就绪';
      }
    </script>
  </body>
</html>
