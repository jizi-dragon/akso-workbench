<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Akso 轮盘</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      html { background: transparent; }
      body {
        font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", sans-serif;
        background: rgba(244, 247, 253, .88);
        backdrop-filter: blur(18px) saturate(1.25);
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(23, 42, 84, .4);
        color: #17233b; user-select: none; cursor: default;
        -webkit-app-region: no-drag;  /* 扇区必须可点击——曾因 body 整体 drag 吞掉全部点击 */
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 6px; height: 100%;
      }
      /* 仅标题与提示条作为拖拽把手 */
      h1, .tip { -webkit-app-region: drag; }
      button, li { -webkit-app-region: no-drag; }
      h1 {
        font-size: 13px; font-weight: 700; color: rgba(23, 42, 84, .65);
        margin: 0 0 2px; letter-spacing: 3px;
      }
      .sector-svg {
        width: min(66vmin, 480px); height: min(66vmin, 480px); display: block;
        filter: drop-shadow(0 10px 26px rgba(23, 42, 84, .18));  /* 极淡外投影，维持层次 */
      }
      .sector .sector-hit {
        fill: var(--acc, #3E76D2); fill-opacity: 0.38;
        stroke: rgba(23, 42, 84, .3); stroke-width: 1.5;
        cursor: pointer; transition: fill-opacity .14s cubic-bezier(.22,1,.36,1);
      }
      @keyframes sector-in {
        from { opacity: 0; transform: scale(.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .sector {
        transform-box: view-box; transform-origin: center;
        transition: transform .16s ease;
        animation: sector-in .3s cubic-bezier(.3, .9, .35, 1) backwards;
      }
      .sector:hover { transform: scale(1.016); }
      .sector:hover .sector-hit { fill-opacity: 0.66; }
      /* 轨道：分段渐变由 JS 逐段内联注入（沿弧走向渐变）——勿在此设 stroke 覆盖 */
      .sector-dot { fill: rgba(23, 42, 84, .35); }
      .sector .sector-label {
        fill: #17233b; font-size: 21px; font-weight: 600;
        paint-order: stroke; stroke: rgba(255, 255, 255, .75); stroke-width: 3px;
        pointer-events: none;
      }
      .sector-num circle { fill: rgba(255, 255, 255, .95); }
      .sector-num text { fill: #17233b; font-size: 20px; font-weight: 700; }
      .hub-bg { fill: rgba(255, 255, 255, .88); stroke: rgba(30, 111, 255, .35); stroke-width: 1.5; cursor: pointer; }
      text.hub-page { fill: #17233b; font-size: 26px; font-weight: 700; text-anchor: middle; }
      text.hub-sub { fill: rgba(23, 42, 84, .55); font-size: 14px; text-anchor: middle; }
      .box-node { fill: rgba(23, 42, 84, .35); cursor: pointer; }
      .box-node-on { fill: #1E6FFF; }
      .tip { font-size: 11px; color: rgba(23, 42, 84, .55); letter-spacing: 1px; }
      .empty { color: rgba(23, 42, 84, .6); font-size: 13px; }
      .close-x {
        position: fixed; top: 10px; right: 12px;
        background: none; border: none; color: rgba(23, 42, 84, .6);
        font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px;
        -webkit-app-region: no-drag;
      }
      .close-x:hover { color: #17233b; background: rgba(23, 42, 84, .1); }
    </style>
  </head>
  <body>
    <button class="close-x" id="close-x" title="关闭 (Esc)">×</button>
    <h1>AKSO 账号轮盘</h1>
    <div id="wheel-root" class="sector-svg"><span class="empty">加载中…</span></div>
    <span class="tip">点击扇区启动并切换 · 滚轮/Hub 切盒 · 数字键快选 · Esc 关闭 · 拖动空白移动窗口</span>
    <script>
      /* Electron 透明窗模式：仅 html 层透明——body 保持浅色磨砂卡片（0.2.15 浅色主题） */
      if (new URLSearchParams(location.search).get('transparent') === '1') {
        document.documentElement.style.background = 'transparent';
      }
    </script>
    <script type="module">
      const COLORS = ['#1E6FFF', '#0FA3B1', '#7C5CFF', '#FF7A1A', '#22C55E'];
      const SIZE = 520, C = SIZE / 2, R_OUT = 240, R_IN = 118, R_ARC = 254, GAP_DEG = 2;
      const WHEEL_MAX = 10;
      const NS = 'http://www.w3.org/2000/svg';
      let accounts = [];
      let accountIds = [];
      let pages = [];
      let wheelPage = 0;
      let disabledBoxes = [];
      let lastWheelFp = '';

      /* 关闭：Electron 子窗 window.close 可靠（pywebview 时代的 js_api 已随壳退役） */
      function closeWheel() {
        window.close();
      }

      const polar = (r, deg) => {
        const a = ((deg - 90) * Math.PI) / 180;
        return { x: C + r * Math.cos(a), y: C + r * Math.sin(a) };
      };
      const sectorPath = (a0, a1) => {
        const s = a0 + GAP_DEG / 2, e = a1 - GAP_DEG / 2;
        const large = e - s > 180 ? 1 : 0;
        const p1 = polar(R_OUT, s), p2 = polar(R_OUT, e), p3 = polar(R_IN, e), p4 = polar(R_IN, s);
        return `M ${p1.x} ${p1.y} A ${R_OUT} ${R_OUT} 0 ${large} 1 ${p2.x} ${p2.y}` +
               ` L ${p3.x} ${p3.y} A ${R_IN} ${R_IN} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
      };
      const svgEl = (name, attrs = {}) => {
        const n = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        return n;
      };
      const radialText = (cls, mid, r, content) => {
        const p = polar(r, mid);
        const flip = mid > 90 && mid < 270;
        const t = svgEl('text', {
          class: cls, x: p.x, y: p.y, 'text-anchor': 'middle',
          'dominant-baseline': 'central',
          transform: `rotate(${flip ? mid + 180 : mid} ${p.x} ${p.y})`,
        });
        t.textContent = content;
        return t;
      };

      function groupPagesByBox(list) {
        const pages = [];
        const byName = new Map();
        for (const a of list) {
          const name = (a.box || '').trim();
          if (disabledBoxes.includes(name)) continue; // 禁用盒：轮盘跳过（上游 3.10 语义）
          if (!byName.has(name)) {
            const arr = []; // 同一引用——曾写成两个数组导致扇区永远为空（0.2.12 实锤断点）
            byName.set(name, arr);
            pages.push({ label: name || '默认盒子', list: arr });
          }
          byName.get(name).push(a);
        }
        return pages;
      }

      async function postCommand(type, payload) {
        await fetch('/extension/commands', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, payload }),
        });
      }
      async function launchChrome() {
        await fetch('/extension/launch-chrome', { method: 'POST' }).catch(() => undefined);
      }
      async function pick(accountId) {
        await launchChrome();                 // Chrome 未运行则拉起（扩展随之接管）
        await postCommand('par.open', { accountId });
        closeWheel();
      }

      function buildWheel() {
        const root = document.getElementById('wheel-root');
        root.innerHTML = '';
        if (!accounts.length || !pages.length || !pages.some((p) => p.list.length)) {
          root.innerHTML = '<span class="empty">暂无可选账号——请在账号中心添加或启用盒子</span>';
          return;
        }
        const svg = svgEl('svg', { class: 'sector-svg', viewBox: `0 0 ${SIZE} ${SIZE}` });
        root.appendChild(svg);
        // 0.2.18：移除外圈描边盘（仅保留分区色块/标签/中心文字）；层次靠 .sector-svg 极淡投影

        // 轨道：轮盘正右侧 150° 同心弧（-75°→+75°，3 点钟方向为中线，开口朝左），
        // 与外缘固定间隙（R_ARC 254 - R_OUT 240 = 14px）；沿弧走向分段渐变（蓝→紫→绿）
        const trackA = 15, trackB = 165;
        const SEG = 30;
        const stops = [[30, 111, 255], [124, 92, 255], [34, 197, 94]];
        const colAt = (t) => {
          const seg = t < 0.5 ? 0 : 1;
          const lt = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
          const c0 = stops[seg], c1 = stops[seg + 1];
          const mix = (x, y) => Math.round(x + (y - x) * lt);
          return `rgb(${mix(c0[0], c1[0])},${mix(c0[1], c1[1])},${mix(c0[2], c1[2])})`;
        };
        for (let i = 0; i < SEG; i++) {
          const a0 = trackA + ((trackB - trackA) * i) / SEG;
          const a1 = trackA + ((trackB - trackA) * (i + 1)) / SEG;
          const p0 = polar(R_ARC, a0), p1 = polar(R_ARC, a1);
          svg.appendChild(svgEl('path', {
            class: 'box-track',
            d: `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
            stroke: colAt((i + 0.5) / SEG),
            'stroke-width': 9,
            'stroke-linecap': 'round',
            fill: 'none',
          }));
        }
        pages.forEach((pg, idx) => {
          const deg = trackA + ((trackB - trackA) * (idx + 0.5)) / pages.length;
          const pos = polar(R_ARC, deg);
          const node = svgEl('circle', {
            class: `box-node${idx === wheelPage ? ' box-node-on' : ''}`, cx: pos.x, cy: pos.y, r: 7,
          });
          node.addEventListener('click', () => { wheelPage = idx; buildWheel(); });
          svg.appendChild(node);
        });

        const page = pages[wheelPage] || { list: [] };
        const list = page.list.slice(0, WHEEL_MAX);
        const sweep = 360 / Math.max(list.length, 1);
        list.forEach((a, idx) => {
          const a0 = idx * sweep, a1 = (idx + 1) * sweep, mid = (a0 + a1) / 2;
          const globalIdx = accountIds.indexOf(a.id);
          const g = svgEl('g', { class: 'sector' });
          g.style.setProperty('--acc', COLORS[globalIdx % COLORS.length]);
          g.style.animationDelay = `${0.06 + idx * 0.05}s`; // 扇区逐个入场（上游 v3.9 语义）
          const hit = svgEl('path', { class: 'sector-hit', d: sectorPath(a0, a1) });
          hit.addEventListener('click', () => pick(a.id));
          g.appendChild(hit);
          g.appendChild(radialText('sector-label', mid, (R_IN + R_OUT) / 2,
            a.username.length > 8 ? a.username.slice(0, 7) + '…' : a.username));
          const np = polar(R_IN + 26, mid);
          const num = svgEl('g', { class: 'sector-num' });
          num.appendChild(svgEl('circle', { cx: np.x, cy: np.y, r: 13 }));
          const nt = svgEl('text', { x: np.x, y: np.y, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
          nt.textContent = String(idx + 1);
          num.appendChild(nt);
          g.appendChild(num);
          const dp = polar(R_OUT - 12, mid);
          g.appendChild(svgEl('circle', { class: 'sector-dot', cx: dp.x, cy: dp.y, r: 6 }));
          svg.appendChild(g);
        });

        const hub = svgEl('g', { class: 'hub' });
        hub.appendChild(svgEl('circle', { class: 'hub-bg', cx: C, cy: C, r: 100 }));
        const boxLabel = svgEl('text', { class: 'hub-page', x: C, y: C - 26, 'dominant-baseline': 'central' });
        boxLabel.textContent = `${wheelPage + 1}/${pages.length}`;
        hub.appendChild(boxLabel);
        const boxName = svgEl('text', { class: 'hub-sub', x: C, y: C + 14, 'dominant-baseline': 'central' });
        boxName.textContent = (pages[wheelPage]?.label || '默认盒子').slice(0, 12);
        hub.appendChild(boxName);
        const hint = svgEl('text', { class: 'hub-sub', x: C, y: C + 42, 'dominant-baseline': 'central' });
        hint.textContent = '点击切盒';
        hub.appendChild(hint);
        hub.addEventListener('click', () => { wheelPage = (wheelPage + 1) % pages.length; buildWheel(); });
        svg.appendChild(hub);
      }

      async function render() {
        try {
          const data = await fetch('/api/accounts').then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          });
          accounts = data.accounts || [];
          disabledBoxes = data.disabled_boxes || [];
        } catch (e) {
          document.getElementById('wheel-root').innerHTML =
            `<span class="empty">加载失败：${e.message}（服务未就绪？）</span>`;
          return;
        }
        accountIds = accounts.map((a) => a.id);
        pages = groupPagesByBox(accounts);
        if (wheelPage >= pages.length) wheelPage = 0;
        // 指纹防重绘：数据未变不重建（入场动画不重播、悬停态不丢）
        const fp = JSON.stringify([pages.map((p) => [p.label, p.list.map((a) => a.id)]), wheelPage]);
        if (fp === lastWheelFp) return;
        lastWheelFp = fp;
        buildWheel();
      }

      document.getElementById('close-x').onclick = closeWheel;
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeWheel(); return; }
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        const page = pages[wheelPage];
        if (!page) return;
        const idx = Number(e.key) === 0 ? 9 : Number(e.key) - 1; // 0 = 第 10 个（上游语义）
        if (!Number.isNaN(idx) && idx >= 0 && idx < 10 && idx < page.list.length) {
          const a = page.list[idx];
          if (a) pick(a.id);
        }
      });
      document.addEventListener('wheel', (e) => {
        if (pages.length) { wheelPage = (wheelPage + (e.deltaY > 0 ? 1 : pages.length - 1)) % pages.length; buildWheel(); }
      }, { passive: true });

      render();
      setInterval(render, 3000);
    </script>
  </body>
</html>
