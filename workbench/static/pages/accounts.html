<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账号中心 · Workbench</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/modules.css" />
    <link rel="stylesheet" href="/static/css/sidebar.css" />
    <script src="/static/js/sidebar.js" defer></script>
    <link rel="stylesheet" href="/static/css/ql-theme.css" />
    <link rel="stylesheet" href="/static/css/ql-parallel.css" />
    <link rel="stylesheet" href="/static/css/cloud-account.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head cloud-head">
        <div class="brand">
          <span class="brand-ring" aria-hidden="true"><i></i></span>
          <div class="brand-text">
            <h1>账号中心</h1>
            <p>云端账号库 · 数据源始终为云端</p>
          </div>
        </div>
        <div class="head-right">
          <div class="head-actions">
            <a class="btn-primary btn-sm" href="/" title="返回工作台主页" style="text-decoration: none">← 主页</a>
            <button id="btn-refresh" class="btn-ghost btn-sm" type="button">同步云端</button>
            <button id="btn-push" class="btn-ghost btn-sm" type="button" title="把本机旧账号库并上云端">本地推到云端</button>
            <button id="btn-logout" class="btn-ghost btn-sm hidden" type="button">退出登录</button>
          </div>
          <div class="stats">
            <span class="stat"><b id="stat-accounts">—</b><span>账号</span></span>
            <span class="stat"><b id="stat-sites">—</b><span>站点</span></span>
            <span class="stat"><b id="stat-boxes">—</b><span>盒子</span></span>
          </div>
          <span id="cloud-user" class="status-chip" title="云端身份">未登录</span>
        </div>
      </header>

      <div id="cloud-notice" class="cloud-notice hidden" role="status"></div>

      <main id="cloud-content" class="cloud-content">
        <section class="card block">
          <div class="block-head row">
            <div>
              <h2>云端账号</h2>
              <p class="desc">只读展示云端账号库；本地不再维护账号、盒子与密码。</p>
            </div>
            <span id="cloud-counts" class="cloud-counts"></span>
          </div>
          <div class="cloud-toolbar">
            <div id="box-chips" class="chips"></div>
            <input id="acc-search" class="cloud-search" type="search" placeholder="搜索站点 / 用户名 / 页签名" autocomplete="off" />
          </div>
          <ul id="acc-wall" class="account-grid">
            <li class="empty" style="grid-column:1/-1"><span class="empty-ico">⌛</span>正在读取云端账号库…</li>
          </ul>
        </section>

        <section class="card block">
          <div class="block-head">
            <h2>站点</h2>
            <p class="desc">云端站点台账；桌面端不提供本地站点编辑。</p>
          </div>
          <ul id="site-list" class="plain site-list cloud-list"></ul>
        </section>

        <section class="card block">
          <div class="block-head">
            <h2>盒子</h2>
            <p class="desc">云端盒子清单（含空盒）；账号归属以云端为准。</p>
          </div>
          <ul id="box-list" class="plain site-list cloud-list"></ul>
        </section>
      </main>
    </div>

    <!-- 未登录遮罩：覆盖账号中心内容，但保留左侧导航可用 -->
    <div id="login-overlay" class="cloud-login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="cloud-login-card">
        <div class="login-emblem" aria-hidden="true">A</div>
        <h2 id="login-title">登录云端账号库</h2>
        <p id="login-message" class="login-message">账号中心的数据全部来自云端，请先登录。</p>
        <button id="cloud-login" class="btn-primary login-button" type="button">开始登录</button>
        <div id="login-progress" class="login-progress hidden" aria-live="polite"></div>
        <p class="login-hint">会打开系统浏览器完成授权；批准后自动返回，不需要抄验证码。</p>
      </div>
    </div>

    <script type="module" src="/static/js/accounts.js"></script>
  </body>
</html>
