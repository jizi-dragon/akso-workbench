<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>配置 · Workbench</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/modules.css" />
  </head>
  <body>
    <div class="module-shell">
      <header class="module-topbar">
        <a class="back" href="/">← 返回工作台</a>
        <h1>配置</h1>
        <span class="sub">蓝图校验 / 幂等创建 / 拓扑编排 / 断点续跑（能力已原生化，原仓库只读）</span>
        <div class="spacer"></div>
        <span class="status-badge" id="module-health">检测中…</span>
      </header>

      <section class="mcard">
        <h2>① 上传蓝图</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="file" id="fac-file" accept=".json" />
          <button class="mbtn ghost" id="btn-fac-upload">上传暂存</button>
          <span class="hint" id="fac-upload-result" style="margin:0"></span>
        </div>
        <div id="fac-blueprints" style="margin-top:12px"></div>
      </section>

      <section class="mcard">
        <h2>② 执行任务</h2>
        <div class="mgrid cols-3">
          <label class="mfield">
            蓝图
            <select id="fac-blueprint"></select>
          </label>
          <label class="mfield">
            凭证账号（配置池，取自账号中心）
            <select id="fac-account"></select>
          </label>
        </div>
        <div style="display:flex;gap:14px;align-items:center;margin-top:12px">
          <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:#f0b429">
            <input type="checkbox" id="fac-confirmed" />
            环境强制确认：我确认以上环境/账号将执行配置写入（由 UI 承担；引擎侧另有 confirmed 闸门）
          </label>
          <div style="flex:1"></div>
          <button class="mbtn" id="btn-fac-run">▶ 执行</button>
        </div>
        <p class="hint">
          <b>这里只做执行</b>：「一句话 → 蓝图」现在在<b>对话</b>里做（让 Agent 先给你一份审阅清单，
          你点头它才动手），本页负责用已有的 blueprint.json 直接创建，以及手工上传。
        </p>
        <p class="hint">
          凭证由统一账号库解密后在内存中直连平台（原生 httpx），<b>不落盘、不写原项目目录</b>；
          任务日志与产物落在本机 <span class="mono">runtime/factory/&lt;blueprint_id&gt;/</span>。
        </p>
      </section>

      <section class="mcard">
        <h2>执行日志</h2>
        <div class="log-console" id="fac-log"><div class="sys">// 等待执行…</div></div>
      </section>

      <section class="mcard">
        <h2>任务历史（含断点状态）</h2>
        <table class="mtable" id="fac-jobs">
          <thead><tr><th>时间</th><th>命令</th><th>状态</th><th>详情</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
    <script type="module" src="/static/js/factory.js"></script>
  </body>
</html>
