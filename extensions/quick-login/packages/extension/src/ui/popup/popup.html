<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="pop">
      <header class="brand">
        <span class="brand-ring" aria-hidden="true"><i></i></span>
        <div class="brand-text">
          <h1>QuickLogin</h1>
          <p>多账号并行 · 纯浏览器隔离</p>
        </div>
        <span class="ver" id="ext-version">v—</span>
      </header>

      <section class="stats">
        <div class="stat">
          <b id="stat-accounts">—</b>
          <span>账号</span>
        </div>
        <i class="divider"></i>
        <div class="stat stat-online">
          <b id="stat-online">—</b>
          <span>在线</span>
        </div>
        <i class="divider"></i>
        <div class="stat">
          <b id="stat-boxes">—</b>
          <span>盒子</span>
        </div>
      </section>

      <section class="grant">
        <div class="grant-head">
          <span>站点授权</span>
          <button id="export-diag" class="grant-btn" type="button" title="下载诊断包（排查问题时发给开发者）" style="padding: 2px 9px; font-weight: 400">导出诊断</button>
        </div>
        <ul id="grant-list" class="grant-list"></ul>
      </section>

      <footer class="foot">
        <span><kbd>Alt+Q</kbd> 呼出账号轮盘</span>
        <i></i>
        <span>轮盘内点击扇区即可切换</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
