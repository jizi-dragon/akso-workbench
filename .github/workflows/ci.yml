name: CI

# 门禁的目标只有一个：**把"靠人记得跑"变成"不能不跑"**。
#
# 为什么需要它（2026-09-17 立）：本仓的测试与打包静态核对此前**全靠手工执行**，
# 而 `tools/verify_packaging.py` **根本没有被旧构建脚本调用**（CONTRIBUTING §6 记的已知问题）。
# 后果是：一条"源码已 bump、产物未重建"的不一致能在仓库里潜伏到发版才暴露。
# CI 是这条断点的唯一自动防线。
# （2026-10-19：Electron 退役；打包静态核对改查 Tauri 资源映射与构建脚本。）
#
# 设计取舍（四条，都有理由，别顺手改）：
#   1. **Windows runner**：交付物是 Windows 安装包，P5 检查 `.ps1` 的 UTF-8 BOM。
#      与环境一致比 runner 便宜更重要——**门禁在"和发版不同的平台"上跑，绿灯不代表能发版**。
#   2. **不自动发版**：版本决策留在 `tools/bump.py`（方案甲）。CI 只读不写，因此无需任何 secret，
#      也不存在"CI 误发一版"的风险。
#   3. **不加 `paths-ignore`**：CI 与分支保护配合时，被跳过的 workflow 会以 pending 卡住合并。
#      全量跑约 1 分钟，不值得为此引入一类"偶尔卡住 PR"的怪问题。
#   4. **同一 ref 上只留最新一次运行**（`concurrency.cancel-in-progress`）：连推两次时，
#      被顶掉的那次会以 **cancelled** 结束，界面上写着 `KeyboardInterrupt` +
#      `Error: The operation was canceled.`——**那不是测试失败，是它被取消了**
#      （2026-09-17 用户就被这个显示误导过一次，见 PITFALLS #43）。
#      留着它是因为"旧提交的结论没有任何价值"，但**判红绿要看最新那次 run**：
#      去 Actions 页看 run 列表，`cancelled` 与 `failure` 是两回事。
#
# 版本管理全貌见 docs/VERSIONING.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test + packaging + lint
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      # 与 tools/build_tauri.ps1 一致：Windows runner 的系统默认编码不是 UTF-8，
      # 而仓库里全是中文文档与中文输出，统一强制 UTF-8 以免日志乱码掩盖真实错误。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 前端契约测试（tests/test_frontend_contract.py）直接 import 真实的 api.js。
      # 没有 Node 时它会 skip，而 skip 在 CI 界面上与"通过"一样绿 —— 所以这里显式装。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # ★ 必须在 `uv sync` **之前**：sync 会就地把过期的 lock 改好，
      # 之后再来 check 永远是通过的（这正是这条漂移能活三周的原因）。
      - name: Version is in sync
        run: python tools/bump.py check

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Sync python dependencies
        run: uv sync --extra dev --extra build

      # 解释器版本契约（2026-09-17 加）。**必须在 uv sync 之后**：那一步才建出 .venv。
      #
      # 动因：本机 .venv 是 conda 的 3.14.6，CI 是 3.12，两边**跳过项与语义都不同**——
      # 3.14 起 `from __future__ import annotations` 不再于运行时求值，于是"注解里写了
      # 未导入的名字"这类错误**只在 3.12 上炸**（这正是 CHANGELOG 里"CI 建起来就没绿过"
      # 那起事故被掩盖九次运行的机制之一）。
      # tests/test_python_version_contract.py 在 pytest 里也钉了这条（守 .python-version == CI），
      # 这里单独再跑一次并**打印实际解释器版本**，是为了让"哪个版本在跑"在 CI 界面上一眼可见。
      - name: Interpreter version contract
        run: |
          .venv\Scripts\python.exe -c "import sys; print('runner python =', sys.version)"
          .venv\Scripts\python.exe -m pytest tests/test_python_version_contract.py -o addopts="" -rs

      # --tb=short：CI 失败时只打印每个失败的首个栈帧，既能定位又不会被几千行日志淹没
      # -o addopts=""：**必须**。pyproject 里 addopts = "-q -m 'not slow'"，命令行再加 -q 会进
      #                ultra-quiet，连 `=== 413 passed ===` 汇总行都不打印，CI 界面看着像"没跑出结果"。
      # -rs：**打印跳过原因**（当前只剩少量平台/可选依赖项）。没有 -rs 时，
      #      "绿灯"会把"哪些没跑"藏起来——门禁必须能看出跳过，不只是"有没有红"。
      - name: Run tests (fast layer)
        run: .venv\Scripts\python.exe -m pytest --tb=short -rs -p no:warnings -o addopts=""

      # 沙箱的真实执行层：真起进程、验 Job Object 与"杀整棵进程树"。
      # 默认被 `-m 'not slow'` 排除（否则每次都多花几秒），所以**必须在这里显式补跑**——
      # 那几项恰恰是沙箱存在的理由，不能因为慢就永远不跑。
      # `-m "slow"` 若一个都没收集到，pytest 会以 exit 5 结束，CI 直接红（防止用例被误删标记）。
      - name: Run tests (sandbox execution layer)
        run: .venv\Scripts\python.exe -m pytest --tb=short -rs -p no:warnings -o addopts="" -m "slow"

      # 打包静态核对（2026-10-19 起查 Tauri 资源映射、构建脚本 BOM、插件 hiddenimports、版本真源）。
      - name: Packaging static checks
        run: .venv\Scripts\python.exe tools\verify_packaging.py

      # Rust 壳最小编译检查（2026-10-22）：Tauri 配置/命令错误不必等到 NSIS 阶段。
      # 先装/更新 stable：GitHub windows runner 的预装 Rust 可能低于 Cargo.toml 的
      # rust-version=1.90，直接 cargo check 会因工具链过旧失败（与代码无关）。
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Stage sidecar placeholder
        run: New-Item -ItemType Directory -Force dist\WorkbenchServer | Out-Null
      - name: Rust shell check
        run: |
          rustc --version
          cargo --version
          cargo check --manifest-path src-tauri\Cargo.toml

      # 工具清单门禁已随 docs/TOOLS.md 于 2026-10-25 删除（判据无对象）

      # uv tool run 会按需下载 ruff（首次约 10 MB）。这是有意的：
      # 与 CONTRIBUTING §7 记录的本地命令**逐字一致**，本地绿 == CI 绿。
      # 结构门禁（2026-10-22）：文件预算 / error-text / 新端点必须登记。
      - name: Structural gates (repolint)
        run: .venv\Scripts\python.exe tools\repolint.py --frontend

      # 敏感路径覆盖率棘轮（2026-10-22）：低于基线红；基线只许升。
      - name: Coverage gate (sensitive paths)
        run: |
          New-Item -ItemType Directory -Force tmp | Out-Null
          .venv\Scripts\python.exe -m coverage run --source=workbench -m pytest -o addopts="" -q
          .venv\Scripts\python.exe -m coverage json -o tmp\coverage.json
          .venv\Scripts\python.exe tools\coverage_gate.py tmp\coverage.json

      - name: Lint (ruff)
        run: uv tool run ruff check .
